<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Minecraft SMP | Contact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="CSS.css">
</head>
<body>
<nav class="navbar navbar-light">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand" href="Home.html">Minecraft SMP</a>

        <div class="dropdown">
            <button class="btn btn-success dropdown-toggle" data-bs-toggle="dropdown">
                Menu
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="Home.html">Home</a></li>
                <li><a class="dropdown-item" href="Register.html">Register</a></li>
                <li><a class="dropdown-item" href="Rules.html">Rules</a></li>
                <li><a class="dropdown-item" href="Contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="Home.html">Home</a></li>
        <li class="breadcrumb-item active">Contact</li>
    </ol>
</div>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-12">

            <div class="card p-4">

                <h3 class="text-center mb-4">Contact Us</h3>

                <form>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" placeholder="Name" required>
                        <label>Your Name</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" placeholder="Email" required>
                        <label>Email Address</label>
                    </div>

                    <div class="form-floating mb-3">
                        <textarea class="form-control" placeholder="Message"
                            style="height: 120px" required></textarea>
                        <label>Your Message</label>
                    </div>

                    <div class="d-grid">
                        <button type="button" class="btn btn-success"
                            data-bs-toggle="modal" data-bs-target="#contactModal">
                            Send Message
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>
</div>
<div class="modal fade" id="contactModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Message Sent</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                Your message has been sent successfully!
            </div>

            <div class="modal-footer">
                <button class="btn btn-success" data-bs-dismiss="modal">
                    OK
                </button>
            </div>

        </div>
    </div>
</div>
</body>

</html>
